<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ArchiMind — SRS Analyzer</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background-color: #f5f7fa;
  }

  .result-section {
    display: none;
    max-height: 600px;
    overflow-y: auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #dee2e6;
    font-family: "Segoe UI", Tahoma, sans-serif;
    white-space: normal;   /* 🔴 مهم */
  }

  .result-section.active {
    display: block;
  }

  .nav-pills .nav-link {
    cursor: pointer;
  }

  /* 🔹 Requirements Styling */
  .req-title {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .req-desc {
    margin-bottom: 16px;
    color: #444;
  }

  .section-header {
    margin-top: 10px;
    margin-bottom: 15px;
    font-weight: 700;
  }
</style>

</head>

<body>
<div class="container py-5">

  <div class="card shadow-sm mx-auto" style="max-width:1200px;">
    <div class="card-body">

      <h3 class="mb-3">ArchiMind — Upload SRS PDF</h3>
      <p class="text-muted">
        Upload an SRS document. The system extracts Functional & Non-Functional Requirements
        and recommends software architectures using multiple AI-based methods.
      </p>

      <!-- Upload Form -->
      <form id="processForm">
        <div class="mb-3">
          <input class="form-control" type="file" id="processFileInput" accept=".pdf">
        </div>
        <button class="btn btn-primary" type="submit">
          Process PDF
        </button>
      </form>

      <hr>

      <!-- Loading -->
      <div id="loadingMessage" class="text-center py-4" style="display:none;">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3">Processing SRS… please wait</p>
      </div>

      <!-- Navigation -->
      <div id="resultNavigation" style="display:none;">
        <h5 class="mt-4">Results</h5>
        <ul class="nav nav-pills mb-3" id="resultTabs">
          <li class="nav-item"><a class="nav-link active" data-tab="extraction">Extraction</a></li>
          <li class="nav-item"><a class="nav-link" data-tab="functional">Functional</a></li>
          <li class="nav-item"><a class="nav-link" data-tab="ordinal">Ordinal</a></li>
          <li class="nav-item"><a class="nav-link" data-tab="binary">Binary</a></li>
          <li class="nav-item"><a class="nav-link" data-tab="weighted">Weighted</a></li>
          <li class="nav-item"><a class="nav-link" data-tab="hybrid">Hybrid</a></li>
        </ul>
      </div>

      <!-- Results -->
      <div id="processResult" style="display:none;">
        <div id="section-extraction" class="result-section active"></div>
        <div id="section-functional" class="result-section"></div>
        <div id="section-ordinal" class="result-section"></div>
        <div id="section-binary" class="result-section"></div>
        <div id="section-weighted" class="result-section"></div>
        <div id="section-hybrid" class="result-section"></div>
      </div>

      <!-- Error -->
      <div id="errorMessage" class="mt-3"></div>

    </div>
  </div>

</div>

<script>
  const form = document.getElementById("processForm");
  const fileInput = document.getElementById("processFileInput");
  const loading = document.getElementById("loadingMessage");
  const resultNav = document.getElementById("resultNavigation");
  const resultBox = document.getElementById("processResult");
  const errorBox = document.getElementById("errorMessage");

  /* =======================
     Tabs handling
  ======================= */
  document.getElementById("resultTabs").onclick = e => {
    if (!e.target.dataset.tab) return;

    document.querySelectorAll(".nav-link").forEach(n =>
      n.classList.remove("active")
    );
    e.target.classList.add("active");

    document.querySelectorAll(".result-section").forEach(s =>
      s.classList.remove("active")
    );
    document
      .getElementById("section-" + e.target.dataset.tab)
      .classList.add("active");
  };

  /* =======================
     RENDER FUNCTIONS
  ======================= */

  function renderExtraction(data) {
    let html = "<h5 class='section-header'>1- Functional Requirements</h5>";

    (data.functional || []).forEach((fr, idx) => {
      html += `
        <div class="mb-3">
          <div class="req-title">${String.fromCharCode(97 + idx)}. ${fr.title}</div>
          <div class="req-desc">${fr.description}</div>
        </div>
      `;
    });

    html += "<hr/><h5 class='section-header'>2- Non-Functional Requirements</h5>";

    (data.nfr_predictions || []).forEach((nfr, idx) => {
      html += `
        <div class="mb-3">
          <div class="req-title">${String.fromCharCode(97 + idx)}. ${nfr.predicted_type}</div>
          <div class="req-desc">${nfr.description}</div>
        </div>
      `;
    });

    return html;
  }

  function renderFunctional(data) {
    if (!data || !data.top_architectures)
      return "<p class='text-muted'>No functional results.</p>";

    let html = "<h5 class='section-header'>Functional Architecture Method</h5>";

    data.top_architectures.forEach((item, idx) => {
      html += `
        <div class="mb-4">
          <div class="req-title">
            ${idx + 1}. ${item.Architecture.replace("_", " ").toUpperCase()}
          </div>
          <div class="req-desc"><strong>Score:</strong> ${item.Score}</div>
          <div class="req-desc">${item.Reason}</div>
        </div>
      `;
    });

    return html;
  }

  function renderOrdinal(data) {
    if (!data || data.length === 0)
      return "<p class='text-muted'>No ordinal results available.</p>";

    let html = "<h5 class='section-header'>Ordinal Method</h5>";

    data.forEach((item, idx) => {
      html += `
        <div class="mb-3">
          <div class="req-title">${idx + 1}. ${item.architecture}</div>
          <div class="req-desc">
            Matched NFRs: <strong>${item.matched_nfrs}</strong>
          </div>
        </div>
      `;
    });

    return html;
  }

  function renderBinary(data) {
    if (!data || !data.top_architectures)
      return "<p class='text-muted'>No binary results available.</p>";

    let html = "<h5 class='section-header'>Binary Method</h5>";

    data.top_architectures.forEach((item, idx) => {
      html += `
        <div class="mb-3">
          <div class="req-title">${idx + 1}. ${item.architecture}</div>
          <div class="req-desc">
            Score: <strong>${item.score}</strong>
          </div>
        </div>
      `;
    });

    return html;
  }

  function renderWeighted(data) {
    if (!data || !data.top_architectures)
      return "<p class='text-muted'>No weighted results available.</p>";

    let html = "<h5 class='section-header'>Weighted Score Method</h5>";

    data.top_architectures.forEach((item, idx) => {
      html += `
        <div class="mb-3">
          <div class="req-title">${idx + 1}. ${item.Architecture}</div>
          <div class="req-desc">
            Score: <strong>${item.Score}</strong>
          </div>
        </div>
      `;
    });

    return html;
  }

  function renderHybrid(data) {
    if (!data || data.length === 0)
      return "<p class='text-muted'>No hybrid results available.</p>";

    let html = "<h5 class='section-header'>Hybrid Method – Final Decision</h5>";

    data.forEach((item, idx) => {
      html += `
        <div class="mb-4">
          <div class="req-title">
            ${idx + 1}. ${item.Architecture.replace("_", " ").toUpperCase()}
          </div>
          <div class="req-desc">
            <strong>Final Score:</strong> ${item.FinalScore}%
          </div>
          <div class="req-desc text-muted">
            Aggregated from Functional, Ordinal, Binary, and Weighted methods.
          </div>
        </div>
      `;
    });

    return html;
  }

  /* =======================
     SHOW RESULTS
  ======================= */

  function showResults(data) {
    loading.style.display = "none";
    resultNav.style.display = "block";
    resultBox.style.display = "block";
    errorBox.innerHTML = "";

    document.getElementById("section-extraction").innerHTML =
      renderExtraction(data);

    document.getElementById("section-functional").innerHTML =
      renderFunctional(data.functional_method);

    document.getElementById("section-ordinal").innerHTML =
      renderOrdinal(data.ordinal_method);

    document.getElementById("section-binary").innerHTML =
      renderBinary(data.binary_method);

    document.getElementById("section-weighted").innerHTML =
      renderWeighted(data.weighted_method);

    document.getElementById("section-hybrid").innerHTML =
      renderHybrid(data.hybrid_method);
  }

  /* =======================
     FORM SUBMIT
  ======================= */

  form.onsubmit = async e => {
    e.preventDefault();

    if (!fileInput.files.length) {
      alert("Please select a PDF file");
      return;
    }

    loading.style.display = "block";
    resultNav.style.display = "none";
    resultBox.style.display = "none";
    errorBox.innerHTML = "";

    const fd = new FormData();
    fd.append("file", fileInput.files[0]);

    try {
      const res = await fetch("/extract", { method: "POST", body: fd });
      const data = await res.json();

      if (data.error) throw data;

      showResults(data);
    } catch (err) {
  loading.style.display = "none";

  let msg = err.error || err;

  let details = "";
  if (err.file) {
    details = `
      <hr/>
      <strong>File:</strong> ${err.file}<br/>
      <strong>Line:</strong> ${err.line}<br/>
      <strong>Code:</strong>
      <pre>${err.code}</pre>
    `;
  }

  errorBox.innerHTML = `
    <div class="alert alert-danger">
      <strong>Processing failed</strong><br/>
      <pre>${msg}</pre>
      ${details}
    </div>
  `;
}

  };
</script>


</body>
</html>
